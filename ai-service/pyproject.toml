[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
exclude = [".venv"]

[[tool.mypy.overrides]]
module = ["fitz", "docx", "docx.*", "pptx", "pptx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
